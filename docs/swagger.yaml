basePath: /v1
definitions:
  models.Event:
    properties:
      date:
        type: string
      flyer:
        type: string
      id:
        type: integer
      location:
        type: string
      name:
        type: string
    type: object
host: localhost:5000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API para gerenciamento de eventos e shows da banda Retrovisionarios.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Retrovisionarios API
  version: "1.0"
paths:
  /events:
    get:
      description: Retorna uma lista de eventos, opcionalmente filtrada por ano.
      parameters:
      - description: Ano para filtrar eventos
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Event'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar eventos
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Cria um novo evento de show.
      parameters:
      - description: Dados do evento
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/models.Event'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Event'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar evento
      tags:
      - events
swagger: "2.0"
